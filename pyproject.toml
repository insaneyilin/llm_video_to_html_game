[project]
name = "qwen-video-to-html-game"
version = "0.1.0"
description = "Turn short gameplay videos into playable single-file HTML5 games with Ollama and Qwen."
authors = [
    { name = "guiyilin-looki" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "ollama>=0.6.2",
    "pydantic>=2.13.0",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "socksio>=1.0.0",
    "playwright>=1.57.0",
    "openai>=2.11.0",
    "python-dotenv>=1.2.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.0"
watchdog = "^6.0.0"

[tool.ruff]
line-length = 100
target-version = "py312"
