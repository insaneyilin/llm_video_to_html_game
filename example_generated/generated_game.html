<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PixelSnake</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: monospace;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border: 2px solid white;
      background: black;
      display: block;
      margin: 20px auto;
      tabindex="0";
    }
    #ui {
      text-align: center;
      margin: 20px;
    }
    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
    #instructions {
      font-size: 18px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="score">Score: 0</div>
      <div id="instructions">Use arrow keys to move. Survive 30 seconds!</div>
      <div class="hidden" id="start-screen">
        <button onclick="startGame()">Start Game</button>
      </div>
      <div class="hidden" id="game-over">
        <div id="game-over-message">Game Over!</div>
        <button onclick="restartGame()">Restart</button>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over');
    const gameContainer = document.getElementById('game-container');
    const gameCanvas = document.getElementById('gameCanvas');

    let snake = [{ x: 10, y: 10 }];
    let direction = { x: 0, y: 0 };
    let food = { x: 5, y: 5 };
    let score = 0;
    let timeLeft = 30000;
    let gameInterval;
    let gameRunning = false;
    let lastDirection = { x: 0, y: 0 };

    const gridSize = 20;
    const canvasSize = 400;
    const cellSize = canvasSize / gridSize;

    function init() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 0, y: 0 };
      lastDirection = { x: 0, y: 0 };
      food = { x: 5, y: 5 };
      score = 0;
      timeLeft = 30000;
      gameRunning = false;
      gameOverScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      gameContainer.classList.add('hidden');
      gameCanvas.focus();
    }

    function startGame() {
      init();
      gameRunning = true;
      startScreen.classList.add('hidden');
      gameContainer.classList.remove('hidden');
      gameCanvas.focus();
      gameInterval = setInterval(update, 100);
      document.addEventListener('keydown', handleKeydown);
    }

    function restartGame() {
      init();
      gameRunning = true;
      gameOverScreen.classList.add('hidden');
      gameContainer.classList.remove('hidden');
      gameCanvas.focus();
      gameInterval = setInterval(update, 100);
      document.addEventListener('keydown', handleKeydown);
    }

    function update() {
      if (!gameRunning) return;

      // Handle movement
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      
      // Check wall collision
      if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
        endGame();
        return;
      }

      // Check self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame();
          return;
        }
      }

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.textContent = `Score: ${score}`;
        spawnFood();
      } else {
        snake.pop();
      }

      // Add new head
      snake.unshift(head);

      // Update time
      timeLeft -= 100;
      if (timeLeft <= 0) {
        endGame();
        return;
      }

      draw();
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * gridSize),
        y: Math.floor(Math.random() * gridSize)
      };
      
      // Ensure food doesn't spawn on snake
      for (let i = 0; i < snake.length; i++) {
        if (food.x === snake[i].x && food.y === snake[i].y) {
          spawnFood();
          break;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      
      // Draw snake
      ctx.fillStyle = 'lime';
      for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize - 1, cellSize - 1);
      }
      
      // Draw food
      ctx.fillStyle = 'red';
      ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize - 1, cellSize - 1);
    }

    function endGame() {
      clearInterval(gameInterval);
      gameRunning = false;
      gameOverScreen.classList.remove('hidden');
      gameContainer.classList.add('hidden');
      document.removeEventListener('keydown', handleKeydown);
      gameCanvas.blur();
    }

    function handleKeydown(e) {
      e.preventDefault();
      if (!gameRunning) return;
      
      switch (e.key) {
        case 'ArrowLeft':
          if (lastDirection.x !== 0) return;
          direction = { x: -1, y: 0 };
          break;
        case 'ArrowUp':
          if (lastDirection.y !== 0) return;
          direction = { x: 0, y: -1 };
          break;
        case 'ArrowRight':
          if (lastDirection.x !== 0) return;
          direction = { x: 1, y: 0 };
          break;
        case 'ArrowDown':
          if (lastDirection.y !== 0) return;
          direction = { x: 0, y: 1 };
          break;
        case ' ':
          if (!gameRunning) {
            startGame();
          } else {
            // Restart on spacebar during game
            endGame();
            restartGame();
          }
          break;
      }
      lastDirection = direction;
    }

    // Auto-focus on load
    window.addEventListener('load', () => {
      gameCanvas.focus();
    });

    // Focus on click
    gameCanvas.addEventListener('click', () => {
      gameCanvas.focus();
    });

    // Focus on keydown
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' && !gameRunning) {
        startGame();
      }
    });
  </script>
<script>
(function () {
  const canvas = document.querySelector("canvas");
  if (!canvas) return;
  if (!canvas.hasAttribute("tabindex")) canvas.setAttribute("tabindex", "0");

  function focusGame() {
    try { canvas.focus(); } catch (error) {}
  }

  window.addEventListener("load", focusGame);
  canvas.addEventListener("click", focusGame);
  document.querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => setTimeout(focusGame, 50));
  });
  document.addEventListener("keydown", (event) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
      event.preventDefault();
    }
  }, { passive: false });
})();
</script>
</body>
</html>
